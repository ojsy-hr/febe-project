<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

    <head>
        <title>FEBE</title>
        <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    
    <body>

    <header class="mb-5">
        <div class="container-lg text-center">
            <h1>Sign Up Below</h1>
        </div>
    </header>
    
    <section class="container-sm ps-5 pe-5">

        <form action="#" th:action="@{/createNewUser}" th:object="${username}" method="POST">
            <div class="mb-3">
                <label for="signupEmail" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="signupEmail" aria-describedby="signupEmailHelp">
                <div id="signupEmailHelp" class="form-text">We'll never share your email with anyone else</div>
            </div>

            <div class="mb-3">
                <label for="signupPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="signupPassword">
            </div>
            <button class="btn btn-primary">Submit</button>
        </form>
        
    </section>

    </body>
</html>
