<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>FEBE</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>

    <body class="d-flex flex-column min-vh-100">

    <header class="text-center bg-body-secondary text-muted">
        <div class="d-flex">

            <div class="w-25">
                <!-- To recentre H1 after adding logout button -->
            </div>

            <div class="text-center w-50">
                <h1>System Settings</h1>
            </div>

            <div class="w-25 justify-content-end">
                <form action="#" th:action="@{/logout}" method="POST">
                    <input value="Log Out" type="submit" class="btn btn-danger mt-2">
                </form>
            </div>

        </div>
    </header>

    <section class="container mt-5">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Configure users from this page</h5>
            </div>

            <table class="table table-striped mb-0">
                <thead>
                    <tr>
                        <th scope="col">Email</th>
                        <th scope="col">Roles</th>
                        <th scope="col">Status</th>
                        <th scope="col">Edit</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.email}"></td>
                        <td>
                            <span class="badge text-bg-secondary me-1"
                                  th:each="role : ${user.roles}"
                                  th:text="${role.role}"></span>
                        </td>
                        <td th:text="${user.enabled} ? 'Enabled' : 'Disabled'"></td>
                        <td>
                            <a th:href="@{/system/edit-user(email=${user.email})}" class="btn btn-info btn-sm">
                                Edit
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="4" class="text-muted">No users yet.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <footer class="text-center text-lg-start bg-body-secondary text-muted mt-auto">
        <div class="text-center p-4">
            <a th:href="@{/home}">Back to Home</a>
        </div>
    </footer>
    </body>
</html>
