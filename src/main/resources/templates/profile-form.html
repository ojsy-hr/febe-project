<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <title>FEBE</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>

    <body class="d-flex flex-column min-vh-100">
        <header class="text-center bg-body-secondary text-muted">
            <div class="d-flex">

                <div class="w-25">
                    <!-- To recentre H1 after adding logout button -->
                </div>

                <div class="text-center w-50">
                    <h1>Profile</h1>
                    <!--                    <p th:text="${currentUser.userId}"></p>-->
                    <p sec:authentication="name"></p>
                </div>

                <div class="w-25 justify-content-end">
                    <form action="#" th:action="@{/logout}" method="POST">
                        <input value="Log Out" type="submit" class="btn btn-danger mt-2">
                    </form>
                </div>

            </div>
        </header>

        <section class="container mt-5">
            <h2>Edit Profile</h2>
            <hr>

            <form action="#" th:action="@{/profile/save}" th:object="${userProfile}" method="POST" class="w-50">

                <input type="hidden" th:field="*{userProfileId}"/>
                
                <div class="mb-3">
                    <label for="userAge" class="form-label"><h3>Age</h3></label>
                    <input type="number" th:field="*{age}" class="form-control" id="userAge">
                </div>

                <div>
                    <h3>Gender</h3>
                    <ul style="list-style-type: none">
                        <li>
                            <label for="male">Male</label>
                            <input name="choice" type="radio" th:field="*{gender}" value="male" id="male">
                        </li>
                        <li>
                            <label for="female">Female</label>
                            <input name="choice" type="radio" th:field="*{gender}" value="female" id="female">
                        </li>
                    </ul>
                </div>
<!--                <div>-->
<!--                    <h3>DoB</h3>-->
<!--                    <input type="date" th:field="*{dateOfBirth}">-->
<!--                </div>-->
                <div>
                    <h3>Hobby</h3>
                    <input type="text" th:field="*{hobby}">
                </div>
                <div>
                    <h3>Bio</h3>
                    <input type="text" th:field="*{bio}">
                </div>

                <button class="btn btn-primary">Save</button>
                <a th:href="@{/profile}" class="btn btn-secondary">Cancel</a>

            </form>
        </section>

        <footer class="text-center text-lg-start bg-body-secondary text-muted mt-auto">
            <div class="text-center p-4">
                <a th:href="@{/home}">Back to Home</a>
            </div>
        </footer>
    </body>>
</html>
