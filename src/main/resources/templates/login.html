<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>FEBE</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>

    <section class="container mt-5">

        <div class="row justify-content-center">
            <div class="card" style="width: 22rem">
                <div class="card-body">
                    <h5 class="card-title">Log In</h5>
                </div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">

                        <div th:if="${param.error}" class="alert alert-danger">Invalid email address or password.</div>
                        <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>
                        <div th:if="${param.signup}" class="alert alert-success">Account created. Please log in.</div>

                        <form action="#" th:action="@{/authenticate}" method="POST">
                            <div class="mb-3">
                                <label for="loginEmail" class="form-label">Email Address</label>
                                <input type="email" name="username" class="form-control" id="loginEmail" aria-describedby="loginEmailHelp">
                                <div id="loginEmailHelp" class="form-text">Enter your email</div>
                            </div>

                            <div class="mb-3">
                                <label for="loginPassword" class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" id="loginPassword">
                            </div>

                            <button type="submit" class="btn btn-primary">Log In</button>
                            <a th:href="@{/sign-up}" class="btn btn-success">Sign up</a>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </section>

    </body>
</html>
